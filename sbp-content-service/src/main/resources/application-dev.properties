spring.devtools.restart.enabled=true

sbp.content.datasource.host=${CONTENT_DB_HOST:localhost}
sbp.content.datasource.port=${CONTENT_DB_PORT:5432}
sbp.content.datasource.name=${CONTENT_DB_NAME}
sbp.content.datasource.username=${CONTENT_DB_USERNAME}
sbp.content.datasource.password=${CONTENT_DB_PASSWORD}
sbp.content.datasource.timezone=${APP_TIMEZONE:Asia/Kolkata}

spring.datasource.url=jdbc:postgresql://${sbp.content.datasource.host}:${sbp.content.datasource.port}/${sbp.content.datasource.name}?TimeZone=${sbp.content.datasource.timezone}
spring.datasource.username=${sbp.content.datasource.username}
spring.datasource.password=${sbp.content.datasource.password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=${sbp.content.datasource.timezone}

sbp.clients.reference-base-url=${REFERENCE_SERVICE_URL:http://localhost:8087}
sbp.clients.studio-base-url=${STUDIO_SERVICE_URL:http://localhost:8085}
sbp.clients.person-base-url=${PERSON_SERVICE_URL:http://localhost:8084}
