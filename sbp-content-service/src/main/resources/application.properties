spring.application.name=sbp-content-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

sbp.content.port=${CONTENT_PORT:8086}
server.port=${sbp.content.port}
server.servlet.context-path=/api/v1/content

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

sbp.internal-api.base-path=/internal/content
