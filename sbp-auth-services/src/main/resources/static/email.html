<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Email</title>
  </head>
  <body>
    <form id="invite-form">
      <p><label for="email">Email</label></p>
      <p><input id="email" name="email" type="email" required /></p>
      <p><button type="submit">Submit</button></p>
    </form>
    <p id="message"></p>
    <script>
      document.getElementById("invite-form").addEventListener("submit", function (event) {
        event.preventDefault();
        var emailInput = document.getElementById("email");
        var message = document.getElementById("message");
        message.textContent = "Checking invitation...";
        fetch("invitations/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: emailInput.value }),
        })
          .then(function (response) {
            return response.json();
          })
          .then(function (payload) {
            if (payload && payload.data) {
              message.textContent = payload.data.message;
            } else if (payload && payload.message) {
              message.textContent = payload.message;
            } else {
              message.textContent = "Unexpected response from server.";
            }
          })
          .catch(function () {
            message.textContent =
              "Could not reach the auth service. Start sbp-auth-services and open this page at /api/v1/auth/email.html";
          });
      });
    </script>
  </body>
</html>
