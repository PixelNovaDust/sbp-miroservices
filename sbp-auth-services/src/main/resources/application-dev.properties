spring.devtools.restart.enabled=true

sbp.auth.datasource.host=${AUTH_DB_HOST:localhost}
sbp.auth.datasource.port=${AUTH_DB_PORT:5432}
sbp.auth.datasource.name=${AUTH_DB_NAME}
sbp.auth.datasource.username=${AUTH_DB_USERNAME}
sbp.auth.datasource.password=${AUTH_DB_PASSWORD}
sbp.auth.datasource.timezone=${APP_TIMEZONE:Asia/Kolkata}

spring.datasource.url=jdbc:postgresql://${sbp.auth.datasource.host}:${sbp.auth.datasource.port}/${sbp.auth.datasource.name}?TimeZone=${sbp.auth.datasource.timezone}
spring.datasource.username=${sbp.auth.datasource.username}
spring.datasource.password=${sbp.auth.datasource.password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=${sbp.auth.datasource.timezone}
