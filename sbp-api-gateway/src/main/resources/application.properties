spring.application.name=sbp-api-gateway
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

sbp.gateway.port=${GATEWAY_PORT:8080}
server.port=${sbp.gateway.port}
server.servlet.context-path=/api/v1

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

sbp.services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
sbp.services.user.url=${USER_SERVICE_URL:http://localhost:8082}
sbp.internal-api.base-path=/internal/gateway
