spring.application.name=sbp-studio-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

sbp.studio.port=${STUDIO_PORT:8085}
server.port=${sbp.studio.port}
server.servlet.context-path=/api/v1/studios
# Tomcat otherwise 302 POST /api/v1/studios -> /api/v1/studios/; clients often follow with GET (no create)
server.tomcat.redirect-context-root=false
spring.mvc.redirect-trailing-slash=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

sbp.internal-api.base-path=/internal/studios
