spring.devtools.restart.enabled=false

sbp.studio.datasource.host=${STUDIO_DB_HOST:localhost}
sbp.studio.datasource.port=${STUDIO_DB_PORT:5432}
sbp.studio.datasource.name=${STUDIO_DB_NAME}
sbp.studio.datasource.username=${STUDIO_DB_USERNAME}
sbp.studio.datasource.password=${STUDIO_DB_PASSWORD}
sbp.studio.datasource.timezone=${APP_TIMEZONE:Asia/Kolkata}

spring.datasource.url=jdbc:postgresql://${sbp.studio.datasource.host}:${sbp.studio.datasource.port}/${sbp.studio.datasource.name}?TimeZone=${sbp.studio.datasource.timezone}
spring.datasource.username=${sbp.studio.datasource.username}
spring.datasource.password=${sbp.studio.datasource.password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=${sbp.studio.datasource.timezone}
