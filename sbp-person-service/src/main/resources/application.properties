spring.application.name=sbp-person-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

sbp.person.port=${PERSON_PORT:8084}
server.port=${sbp.person.port}
server.servlet.context-path=/api/v1/persons
server.tomcat.redirect-context-root=false
spring.mvc.redirect-trailing-slash=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

sbp.internal-api.base-path=/internal/persons

sbp.clients.reference-base-url=${REFERENCE_SERVICE_URL:http://localhost:8087}
sbp.clients.studio-base-url=${STUDIO_SERVICE_URL:http://localhost:8085}
