spring.devtools.restart.enabled=false

sbp.person.datasource.host=${PERSON_DB_HOST:localhost}
sbp.person.datasource.port=${PERSON_DB_PORT:5432}
sbp.person.datasource.name=${PERSON_DB_NAME}
sbp.person.datasource.username=${PERSON_DB_USERNAME}
sbp.person.datasource.password=${PERSON_DB_PASSWORD}
sbp.person.datasource.timezone=${APP_TIMEZONE:Asia/Kolkata}

spring.datasource.url=jdbc:postgresql://${sbp.person.datasource.host}:${sbp.person.datasource.port}/${sbp.person.datasource.name}?TimeZone=${sbp.person.datasource.timezone}
spring.datasource.username=${sbp.person.datasource.username}
spring.datasource.password=${sbp.person.datasource.password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=${sbp.person.datasource.timezone}
