spring.devtools.restart.enabled=false

sbp.reference.datasource.host=${REFERENCE_DB_HOST:localhost}
sbp.reference.datasource.port=${REFERENCE_DB_PORT:5432}
sbp.reference.datasource.name=${REFERENCE_DB_NAME}
sbp.reference.datasource.username=${REFERENCE_DB_USERNAME}
sbp.reference.datasource.password=${REFERENCE_DB_PASSWORD}
sbp.reference.datasource.timezone=${APP_TIMEZONE:Asia/Kolkata}

spring.datasource.url=jdbc:postgresql://${sbp.reference.datasource.host}:${sbp.reference.datasource.port}/${sbp.reference.datasource.name}?TimeZone=${sbp.reference.datasource.timezone}
spring.datasource.username=${sbp.reference.datasource.username}
spring.datasource.password=${sbp.reference.datasource.password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=${sbp.reference.datasource.timezone}
