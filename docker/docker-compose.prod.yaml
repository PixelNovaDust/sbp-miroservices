services:

  auth-db:
    image: postgres:17
    container_name: sbp-auth-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - sbp-auth-db-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USERNAME} -d ${AUTH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:17
    container_name: sbp-user-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "${USER_DB_PORT}:5432"
    volumes:
      - sbp-user-db-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USERNAME} -d ${USER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  sbp-auth-service:
    build:
      context: ../sbp-auth-services
      dockerfile: Dockerfile
    container_name: sbp-auth-service-prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AUTH_PORT: 8081
      AUTH_DB_HOST: auth-db
      AUTH_DB_PORT: 5432
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "${AUTH_PORT}:8081"
    depends_on:
      auth-db:
        condition: service_healthy

  sbp-user-service:
    build:
      context: ../sbp-user-services
      dockerfile: Dockerfile
    container_name: sbp-user-service-prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      USER_PORT: 8082
      USER_DB_HOST: user-db
      USER_DB_PORT: 5432
      USER_DB_NAME: ${USER_DB_NAME}
      USER_DB_USERNAME: ${USER_DB_USERNAME}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "${USER_PORT}:8082"
    depends_on:
      user-db:
        condition: service_healthy

  sbp-api-gateway:
    build:
      context: ../sbp-api-gateway
      dockerfile: Dockerfile
    container_name: sbp-api-gateway-prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GATEWAY_PORT: 8080
      AUTH_SERVICE_URL: http://sbp-auth-service:8081
      USER_SERVICE_URL: http://sbp-user-service:8082
    ports:
      - "${GATEWAY_PORT}:8080"
    depends_on:
      - sbp-auth-service
      - sbp-user-service

volumes:
  sbp-auth-db-prod-data:
    name: sbp-auth-db-prod-data
  sbp-user-db-prod-data:
    name: sbp-user-db-prod-data
