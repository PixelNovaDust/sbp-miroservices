global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: sbp-auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [sbp-auth-service:9081]
  - job_name: sbp-user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [sbp-user-service:9082]
  - job_name: sbp-person-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [sbp-person-service:9084]
  - job_name: sbp-studio-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [sbp-studio-service:9085]
  - job_name: sbp-content-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [sbp-content-service:9086]
  - job_name: sbp-api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [sbp-api-gateway:9080]
  - job_name: sbp-admin-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [sbp-admin-service:9083]
