spring.devtools.restart.enabled=false

sbp.user.datasource.host=${USER_DB_HOST:localhost}
sbp.user.datasource.port=${USER_DB_PORT:5432}
sbp.user.datasource.name=${USER_DB_NAME}
sbp.user.datasource.username=${USER_DB_USERNAME}
sbp.user.datasource.password=${USER_DB_PASSWORD}
sbp.user.datasource.timezone=${APP_TIMEZONE:Asia/Kolkata}

spring.datasource.url=jdbc:postgresql://${sbp.user.datasource.host}:${sbp.user.datasource.port}/${sbp.user.datasource.name}?TimeZone=${sbp.user.datasource.timezone}
spring.datasource.username=${sbp.user.datasource.username}
spring.datasource.password=${sbp.user.datasource.password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=${sbp.user.datasource.timezone}
