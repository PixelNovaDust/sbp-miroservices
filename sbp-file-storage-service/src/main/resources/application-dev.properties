spring.devtools.restart.enabled=true

sbp.file-storage.datasource.host=${FILE_STORAGE_DB_HOST:localhost}
sbp.file-storage.datasource.port=${FILE_STORAGE_DB_PORT:5432}
sbp.file-storage.datasource.name=${FILE_STORAGE_DB_NAME}
sbp.file-storage.datasource.username=${FILE_STORAGE_DB_USERNAME}
sbp.file-storage.datasource.password=${FILE_STORAGE_DB_PASSWORD}
sbp.file-storage.datasource.timezone=${APP_TIMEZONE:Asia/Kolkata}

spring.datasource.url=jdbc:postgresql://${sbp.file-storage.datasource.host}:${sbp.file-storage.datasource.port}/${sbp.file-storage.datasource.name}?TimeZone=${sbp.file-storage.datasource.timezone}
spring.datasource.username=${sbp.file-storage.datasource.username}
spring.datasource.password=${sbp.file-storage.datasource.password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=${sbp.file-storage.datasource.timezone}
