spring.application.name=sbp-file-storage-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

sbp.file-storage.port=${FILE_STORAGE_PORT:8088}
server.port=${sbp.file-storage.port}

management.endpoints.web.exposure.include=health,info,metrics

spring.servlet.multipart.max-file-size=${FILE_STORAGE_MAX_UPLOAD_SIZE:500MB}
spring.servlet.multipart.max-request-size=${FILE_STORAGE_MAX_UPLOAD_SIZE:500MB}

sbp.storage.enabled=${SBP_STORAGE_ENABLED:true}
sbp.storage.provider=${SBP_STORAGE_PROVIDER:S3}
sbp.storage.region=${SBP_STORAGE_REGION:us-east-1}
sbp.storage.default-bucket=${SBP_STORAGE_DEFAULT_BUCKET:}
sbp.storage.endpoint=${SBP_STORAGE_ENDPOINT:}
sbp.storage.key-prefix=${SBP_STORAGE_KEY_PREFIX:}
sbp.storage.path-style-access=${SBP_STORAGE_PATH_STYLE:false}
sbp.storage.presign-upload-ttl=${SBP_STORAGE_PRESIGN_UPLOAD_TTL:PT15M}
sbp.storage.presign-download-ttl=${SBP_STORAGE_PRESIGN_DOWNLOAD_TTL:PT1H}
